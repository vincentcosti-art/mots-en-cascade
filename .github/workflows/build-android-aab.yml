name: Build Android AAB

on:
  push:
    branches:
      - feat/v2-mots-en-cascade
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mots-en-cascade-v2-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_MOTS_KEY_ALIAS: upload

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard V2 branch and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/v2-mots-en-cascade' || {
            echo "::error::This workflow is restricted to feat/v2-mots-en-cascade"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify signing secrets are present
        shell: bash
        env:
          MOTS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MOTS_UPLOAD_KEYSTORE_BASE64 }}
          MOTS_KEYSTORE_PASSWORD: ${{ secrets.MOTS_KEYSTORE_PASSWORD }}
          MOTS_KEY_PASSWORD: ${{ secrets.MOTS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MOTS_UPLOAD_KEYSTORE_BASE64:-}" || { echo "::error::MOTS_UPLOAD_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "${MOTS_KEYSTORE_PASSWORD:-}" || { echo "::error::MOTS_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "${MOTS_KEY_PASSWORD:-}" || { echo "::error::MOTS_KEY_PASSWORD is missing"; exit 1; }
          echo "All signing secrets are present."

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Corpus report
        run: npm run corpus:report

      - name: Web build
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Prepare signing environment
        shell: bash
        env:
          MOTS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MOTS_UPLOAD_KEYSTORE_BASE64 }}
          MOTS_KEYSTORE_PASSWORD: ${{ secrets.MOTS_KEYSTORE_PASSWORD }}
          MOTS_KEY_PASSWORD: ${{ secrets.MOTS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/mots-en-cascade-upload-keystore.jks"
          keytool_output="$RUNNER_TEMP/mots-en-cascade-upload-keytool.txt"
          umask 077
          printf '%s' "$MOTS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          keytool -list -v \
            -keystore "$keystore_path" \
            -storepass:env MOTS_KEYSTORE_PASSWORD \
            -alias upload > "$keytool_output"
          grep -q 'Entry type: PrivateKeyEntry' "$keytool_output"
          grep -Eq '2048-bit RSA key|2048 bit RSA key' "$keytool_output"
          keystore_sha1="$(awk -F': ' '/^[[:space:]]*SHA1:/{print $2; exit}' "$keytool_output")"
          test "$keystore_sha1" = 'C8:F7:18:DF:9E:E2:D1:3B:54:A7:69:86:21:D0:1D:BA:CE:4F:D9:4D'

          {
            echo "ORG_GRADLE_PROJECT_MOTS_KEYSTORE_PATH=$keystore_path"
            echo "ORG_GRADLE_PROJECT_MOTS_KEYSTORE_PASSWORD=$MOTS_KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_MOTS_KEY_ALIAS=upload"
            echo "ORG_GRADLE_PROJECT_MOTS_KEY_PASSWORD=$MOTS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing keystore validated for alias upload."

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify release AAB
        id: verify
        shell: bash
        env:
          EXPECTED_SHA1: C8:F7:18:DF:9E:E2:D1:3B:54:A7:69:86:21:D0:1D:BA:CE:4F:D9:4D
        run: |
          set -euo pipefail
          aab='android/app/build/outputs/bundle/release/app-release.aab'
          test -f "$aab"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          aapt2_bin="$(find "$sdk_root/build-tools" -type f -name aapt2 -perm -111 -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$aapt2_bin"
          manifest="$RUNNER_TEMP/mots-en-cascade-AndroidManifest.xml"
          manifest_container="$RUNNER_TEMP/mots-en-cascade-manifest.apk"
          manifest_tree="$RUNNER_TEMP/mots-en-cascade-AndroidManifest.xmltree"
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$manifest"
          test -s "$manifest"
          (cd "$RUNNER_TEMP" && zip -q -j "$manifest_container" "$manifest")
          "$aapt2_bin" dump xmltree "$manifest_container" --file AndroidManifest.xml > "$manifest_tree"
          grep -q 'package="com.vincentcosti.motsencascade"' "$manifest_tree"
          grep -Eq 'android:versionCode.*(0x2|=2)' "$manifest_tree"
          grep -q 'android:versionName.*"2.0.0"' "$manifest_tree"

          signature_report="$RUNNER_TEMP/mots-en-cascade-jarsigner.txt"
          jarsigner -verify -verbose -certs "$aab" > "$signature_report"
          grep -q 'jar verified\.' "$signature_report"
          cert_sha1="$(keytool -printcert -jarfile "$aab" 2>/dev/null | awk -F': ' '/^SHA1:/{print $2; exit}')"
          test "$cert_sha1" = "$EXPECTED_SHA1"

          sha256="$(sha256sum "$aab" | awk '{print $1}')"
          size_bytes="$(stat -c '%s' "$aab")"
          {
            echo "aab_path=$aab"
            echo "aab_sha256=$sha256"
            echo "aab_size_bytes=$size_bytes"
            echo "certificate_sha1=$cert_sha1"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Release AAB verified'
            echo '- Package: `com.vincentcosti.motsencascade`'
            echo '- versionCode: `2`'
            echo '- versionName: `2.0.0`'
            echo "- Certificate SHA-1: \`$cert_sha1\`"
            echo "- AAB SHA-256: \`$sha256\`"
            echo "- AAB size: \`${size_bytes} bytes\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mots-en-cascade-v2-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/mots-en-cascade-upload-keystore.jks"
          if [ -f "$keystore_path" ]; then
            chmod 600 "$keystore_path"
            shred --force --remove "$keystore_path" || rm -f "$keystore_path"
          fi
